[package]
name = "pytron_os"
version = "0.1.0"
edition = "2021"

[lib]
name = "pytron_os"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py37"] }
once_cell = "1.19"
dashmap = "5.5"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# tray-icon: battle-tested tray crate by Tauri team. Handles Shell_NotifyIconW,
# HWND_MESSAGE, TrackPopupMenu, etc. internally — no raw Win32 tray code needed.
tray-icon = "0.19"
image = "0.25"
windows = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_System_Console"
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.25"
