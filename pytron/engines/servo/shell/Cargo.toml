[package]
name = "servo-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
servo = { git = "https://github.com/servo/servo" }
surfman = "0.9"
gl = "0.1"
winit = "0.29"
url = "2.5"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
