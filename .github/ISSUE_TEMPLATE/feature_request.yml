name: Feature request
description: Propose an improvement or new capability
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please keep scope focused so we can discuss implementation quickly.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user/developer problem are you trying to solve?
      placeholder: Today it's hard to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior/API you'd like.
      placeholder: Add a command/option that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've tried or considered.
  - type: textarea
    id: impact
    attributes:
      label: Affected areas
      description: Point to files/modules/docs likely impacted if known.
      placeholder: pytron/cli.py, pytron/commands/*, docs/*
