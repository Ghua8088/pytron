name: Test Publish to TestPyPI 🧪

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-wheels:
    name: 🏗️ Build (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: 🛠️ Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: 🐧 Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            pkg-config \
            python3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-indicator3-dev \
            libxdo-dev \
            gir1.2-gtk-4.0

      - name: 🍎 Install macOS Dependencies
        if: matrix.os == 'macos-latest'
        run: |
          python -m pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🛡️ Build Rust Loader
        run: python pytron/pack/secure_loader/build_loader.py || echo "Skipping loader build"

      - name: 🦾 Build Native Engine
        run: python pytron/engines/native/build.py

      - name: 📦 Build Platform Wheel
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            python -m build --wheel
            pip install auditwheel
            for whl in dist/*.whl; do
              new_whl=$(echo $whl | sed 's/linux_x86_64/manylinux_2_35_x86_64/g')
              mv "$whl" "$new_whl"
            done
          else
            python -m build --wheel
          fi

      - name: 📤 Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl

  build-sdist:
    name: 📄 Build SDist
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 📦 Build SDist
        run: |
          pip install build
          python -m build --sdist
      - name: 📤 Upload SDist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-test:
    name: 🚀 Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: 🐍 Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
