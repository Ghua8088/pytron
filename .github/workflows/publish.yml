name: Release & Publish 🐍

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-wheels:
    name: 🏗️ Build Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-20.04 = glibc 2.31, which matches our manylinux_2_31 target tag.
        # ubuntu-latest is now 24.04 (glibc 2.39) and auditwheel will refuse to retag
        # a 2.39-compiled wheel as manylinux_2_31.
        os: [ubuntu-20.04, macos-latest, windows-latest]

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🚪 Check for Rust changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust_native:
              - 'pytron/engines/native/**'
              - 'pytron/engines/native/Cargo.toml'
            rust_loader:
              - 'pytron/pack/secure_loader/**'
              - 'pytron/pack/secure_loader/Cargo.toml'

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: 🛠️ Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      # ─── Linux: install the GTK/WebKit/GLib system deps that wry+tao need ───
      # We pin to ubuntu-22.04 (glibc 2.35) so the compiled .so files match the
      # manylinux_2_35_x86_64 platform tag that auditwheel will apply.
      - name: 🐧 Install Linux System Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libgirepository1.0-dev \
            libglib2.0-dev \
            pkg-config \
            python3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: 🍎 Install macOS Dependencies
        if: matrix.os == 'macos-latest'
        run: |
          python -m pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🕰️ Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          workspaces: |
            pytron/engines/native
            pytron/pack/secure_loader

      - name: 🛡️ Build Rust Loader
        if: steps.filter.outputs.rust_loader == 'true' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        run: python pytron/pack/secure_loader/build_loader.py

      - name: 🦾 Build Native Engine
        if: steps.filter.outputs.rust_native == 'true' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        env:
          PYO3_PYTHON: python3
        run: python pytron/engines/native/build.py

      - name: 📦 Build Wheel
        run: python -m build --wheel

      - name: 🏷️ Retag Linux Wheel (Experimental)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          for whl in dist/*.whl; do
            new_whl=$(echo "$whl" | sed 's/linux_x86_64/manylinux_2_31_x86_64/g')
            mv "$whl" "$new_whl"
          done

      # Linux note:
      # auditwheel is NOT safe for this project right now. It vendors GTK/WebKit/
      # gdk-pixbuf/gstreamer into pytron_kit.libs, but runtime loader modules
      # still come from the host system, producing a mixed GLib/GIO stack and
      # duplicate GType registration crashes at startup.
      #
      # Until Linux packaging is redesigned to rely on system GTK/WebKit runtime
      # deps explicitly, publish the raw linux_x86_64 wheel instead of repairing
      # it into a manylinux wheel.

      - name: 📤 Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: 📄 Build SDist
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 📦 Build SDist
        run: |
          pip install build
          python -m build --sdist
      - name: 📤 Upload SDist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: 🚀 Create Release & Publish
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    permissions:
      contents: write  # Required for creating GitHub Releases
      id-token: write  # Required for OIDC PyPI publishing
    environment:
      name: pypi
      url: https://pypi.org/p/pytron-kit
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Get Version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: 🎁 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Pytron Kit v${{ steps.get_version.outputs.version }} 🧊
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Prepare PyPI Upload Set
        shell: bash
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl pypi-dist/ 2>/dev/null || true
          cp dist/*.tar.gz pypi-dist/ 2>/dev/null || true
          echo "PyPI upload set:"
          ls -1 pypi-dist

      - name: 🐍 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist
          skip-existing: true
