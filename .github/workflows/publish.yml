name: Release & Publish 🐍

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-wheels:
    name: 🏗️ Build Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🚪 Check for Rust changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust_native:
              - 'pytron/engines/native/**'
              - 'pytron/engines/native/Cargo.toml'
              - 'pytron/platforms/pytron_os/**'
            rust_loader:
              - 'pytron/pack/secure_loader/**'
              - 'pytron/pack/secure_loader/Cargo.toml'

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: 🛠️ Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      # ─── Linux: install the GTK/WebKit/GLib system deps that wry+tao need ───
      # We run on ubuntu-latest (a real runner, NOT a manylinux container) so
      # apt-get works fine here. auditwheel repair then re-tags the wheel as
      # manylinux_2_35 after verifying all symbols are satisfied.
      - name: 🐧 Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            pkg-config \
            python3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: 🍎 Install macOS Dependencies
        if: matrix.os == 'macos-latest'
        run: |
          python -m pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🕰️ Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          workspaces: |
            pytron/engines/native
            pytron/pack/secure_loader
            pytron/platforms/pytron_os

      - name: 🛡️ Build Rust Loader
        if: steps.filter.outputs.rust_loader == 'true' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        run: python pytron/pack/secure_loader/build_loader.py

      - name: 🦾 Build Native Engine
        if: steps.filter.outputs.rust_native == 'true' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        run: python pytron/engines/native/build.py

      - name: 🦾 Build OS Platform Hook
        if: steps.filter.outputs.rust_native == 'true' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        run: python pytron/platforms/pytron_os/build.py

      - name: 📦 Build Wheel
        run: python -m build --wheel

      # ─── Linux only: use auditwheel repair to properly re-tag the wheel      ───
      # --plat manylinux_2_35_x86_64 matches ubuntu-22.04+ (glibc 2.35).        ───
      # auditwheel copies in any non-system .so files it finds, but because      ───
      # wry/webkitgtk ARE system libs (installed above) they won't be bundled — ───
      # the repaired wheel just gets the right manylinux platform tag.           ───
      - name: 🩹 Repair Linux Wheel (auditwheel)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install auditwheel
          auditwheel repair dist/*.whl \
            --plat manylinux_2_35_x86_64 \
            -w dist/
          # Remove the original linux_x86_64 tagged wheel
          rm -f dist/*-linux_x86_64.whl

      - name: 📤 Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: 📄 Build SDist
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 📦 Build SDist
        run: |
          pip install build
          python -m build --sdist
      - name: 📤 Upload SDist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: 🚀 Create Release & Publish
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    permissions:
      contents: write  # Required for creating GitHub Releases
      id-token: write  # Required for OIDC PyPI publishing
    environment:
      name: pypi
      url: https://pypi.org/p/pytron-kit
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Get Version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: 🎁 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Pytron Kit v${{ steps.get_version.outputs.version }} 🧊
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
