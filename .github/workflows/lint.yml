name: Lint

on:
  push:
    branches: ["**"]
    paths:
      - 'pytron/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: ["**"]
    paths:
      - 'pytron/**'
      - 'tests/**'
      - 'pyproject.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: |
          pip install ruff black
      - name: Lint and Format Check with Ruff
        run: |
          # Use ruff for ultra-fast linting and format checking
          ruff check .
          ruff format --check .
      - name: Fallback Check with Black
        run: |
          # Ensure Black is also happy with the pyproject.toml config
          black . --check
