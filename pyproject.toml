[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pytron*"]
exclude = ["pytron.engines.servo", "pytron.engines.servo.*"]
namespaces = false

[project]
name = "pytron-kit"
version = "0.3.15.post8"
description = "An Electron-like library for Python to build Cross Platform Apps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["electron", "app", "desktop", "android", "webview"]
authors = [
  { name = "Ghua8088" }
]
dependencies = [
  "watchfiles",
  "pydantic",
  "importlib-metadata; python_version < '3.8'",
  "pyinstaller",
  "Pillow>=12.3.0",   # CVE fixes: PYSEC-2026-2253..2257, 3451..3496
  "rich",
  "comtypes; sys_platform == 'win32'",
  "cryptography>=48.0.1",  # CVE fixes: PYSEC-2026-35,36, GHSA-537c-gmf6-5ccf
  "keyring",
  "requests>=2.33.0",  # CVE fix: PYSEC-2026-2275
  "Cython",
  "python-xlib; sys_platform == 'linux'"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Intended Audience :: Developers",
]

[project.optional-dependencies]
core = [
  "watchfiles",
  "pydantic",
  "importlib-metadata; python_version < '3.8'",
  "Pillow>=12.3.0",
  "rich",
  "requests>=2.33.0",
  "comtypes; sys_platform == 'win32'",
  "python-xlib; sys_platform == 'linux'"
]
nuitka = [
  "nuitka",
  "zstandard"
]

[project.urls]
Homepage = "https://pytron-kit.github.io/"
Repository = "https://github.com/Ghua8088/pytron-kit"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v -ra --tb=short"
norecursedirs = [
    "template_vite",
    "android",
    "env",
    "venv",
    "build",
    "dist",
    "node_modules",
    "*/main/assets/python"
]

[project.scripts]
pytron = "pytron.cli:main"

[tool.setuptools.package-data]
pytron = [
    "installer/*",
    "nsis-setup.exe",
    "utf8_hook.py", 
    "manifests/*",
    "dependencies/**/*", 
    "engines/chrome/**/*",
    "engines/chrome/shell/*",
    "ai_guide.md",
    "platforms/android/shell/app/src/main/assets/python/python314.zip",
    "platforms/android/shell/app/src/main/assets/python/main.py",
    "platforms/android/shell/app/src/main/cpp/*",
    "platforms/android/shell/app/src/main/cpp/include/*",
    "platforms/android/shell/app/src/main/java/com/pytron/android/MainActivity.kt",
    "platforms/android/shell/app/src/main/res/values/strings.xml",
    "platforms/android/shell/app/src/main/res/mipmap-xxhdpi/*",
    "platforms/android/shell/app/src/main/AndroidManifest.xml",
    "platforms/android/shell/app/build.gradle",
    "platforms/android/shell/app/proguard-rules.pro",
    "platforms/android/shell/gradle/wrapper/gradle-wrapper.jar",
    "platforms/android/shell/gradle/wrapper/gradle-wrapper.properties",
    "platforms/android/shell/build.gradle",
    "platforms/android/shell/gradle.properties",
    "platforms/android/shell/gradlew",
    "platforms/android/shell/gradlew.bat",
    "platforms/android/shell/settings.gradle",
    "platforms/android/shell/app/src/main/jnilibs/arm64-v8a/*",
    "pack/secure_loader/bin/*",
    "resources/docgen/*"
]

[tool.setuptools.exclude-package-data]
pytron = [
    "dependencies/pytron_servo.*",
    "engines/servo/**/*",
    "engines/servo/*",
    "engines/native/target/**/*",
    "engines/native/target/*",
    "platforms/android/shell/build/**/*",
    "platforms/android/shell/build/*",
    "platforms/android/shell/.gradle/**/*",
    "platforms/android/shell/.gradle/*",
    "platforms/android/shell/app/build/**/*",
    "platforms/android/shell/app/build/*",
    "platforms/android/shell/app/.cxx/**/*",
    "platforms/android/shell/app/.cxx/*",
    "engines/**/__pycache__/*",
    "**/*.pdb",
    "**/*.rlib",
    "**/*.rmeta",
    "**/*.d",
    "**/*.obj",
]
[tool.black]
line-length = 88
target-version = ['py310']
force-exclude = '''
/(
    android
  | node_modules
  | env
  | venv
  | build
  | dist
)/
'''
